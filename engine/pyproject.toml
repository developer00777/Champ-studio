[project]
name = "champstudio"
version = "1.0.0"
description = "Champ Studio Engine — self-hosted AI image/video/vector studio (Champions Group)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.23",
    "vtracer>=0.6.11",
    "rembg>=2.0.60",
    "numba>=0.59",
    "onnxruntime>=1.17",
    "jsonschema>=4.22",
    "opentimelineio>=0.17",
    "opentimelineio-plugins>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
champstudio = "champstudio.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["champstudio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs model weight downloads; run explicitly with -m slow"]
